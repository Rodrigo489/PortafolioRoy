<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<title>acercademi</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    font-family: 'Montserrat', sans-serif;
    background:linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.1)), url('imagenes/fondo.jpg') no-repeat center center fixed;
}

.contenedor{
    width:90%;
    max-width:1750px;
    background:white;
    border-radius:12px;
    padding:20px;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
    margin:50px auto;
}

.top{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
}

.top img{
    width:100%;
    max-width:350px;
    border-radius:10px;
}

.texto{
    flex:1;
}

.texto h2{
    margin-top:0;
    font-size:2em;
}

.texto p{
    color:#555;
    line-height:1.25em;
}

.cards{
    display:flex;
    gap:30px;
    margin-top:40px;
    flex-wrap:wrap;
}

.card{
    flex:1;
    min-width:100px;
    text-decoration:none;
    color:black;
    text-align:center;
}

.card img{
    width:50%;
    border-radius:10px;
}

.card p{
    margin-top:25px;
    color:#00A8B5;
    font-size:1.5em;
    font-weight:500;
}

.card:hover{
    transform:scale(1.03);
}


</style>
</head>

<body>

<div class="contenedor">

    <div class="top">
        <img src="imagenes/pfp1.jpg" alt="imagen de perfil">
        
        <div class="texto">
            <h2>Acerca de mi</h2>
            <p>
                Soy un animador el cual se especializa principalmente en ilustracion 2D, siendo pixel art mi estilo favorito
            </p>
            <p>
                
            </p>
        </div>
    </div>

    <div class="cards">

        <a href="ilustraciones.html" class="card">
            <img src="imagenes/dib.jpg">
            <p>Ilustraciones</p>
        </a>

        <a href="contactos.html" class="card">
            <img src="imagenes/anim.jpg">
            <p>Contactos</p>
        </a>

    </div>

</div>

</body>
</html>
